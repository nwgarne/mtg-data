name: Refresh MTG Database

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC daily, just after Scryfall's nightly bulk regen and
                          # an hour after rules.yml, so the CR mirror it republishes to
                          # the data branch is already current for the day.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-mtg-db
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build database
        run: python scripts/build-db.py

      - name: Upload to "latest" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest \
              --title "Latest MTG Database" \
              --notes "Daily-refreshed SQLite database of MTG cards and rulings, sourced from Scryfall."

          gh release upload latest /tmp/mtg.db.gz /tmp/manifest.json /tmp/rules.txt --clobber

      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          WT=/tmp/data-branch
          rm -rf "$WT"
          mkdir -p "$WT"
          cd "$WT"

          git init -q -b data
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          cp /tmp/mtg.db.gz    mtg.db.gz
          cp /tmp/manifest.json manifest.json
          cp /tmp/rules.txt     rules.txt

          CARDS=$(jq -r .card_count           manifest.json)
          RULINGS=$(jq -r .ruling_count       manifest.json)
          BUILT_AT=$(jq -r .built_at          manifest.json)
          CR_DATE=$(jq -r .rules_effective_date manifest.json)

          # The manifest hash must describe the rules.txt actually being pushed.
          test "$(sha256sum rules.txt | cut -d' ' -f1)" = "$(jq -r .rules_sha256 manifest.json)" \
            || { echo 'FATAL: rules.txt sha256 does not match manifest.rules_sha256' >&2; exit 1; }

          cat > README.md <<'EOF'
          # mtg-data: `data` branch

          This branch is auto-updated daily by the [refresh workflow](https://github.com/nwgarne/mtg-data/actions/workflows/refresh.yml). It is **force-pushed with no history** and exists solely to provide stable `raw.githubusercontent.com` URLs for consumers that cannot follow GitHub Release download redirects (Release assets 302 to a separate host that some sandboxes block).

          Stable URLs:

          ```
          https://raw.githubusercontent.com/nwgarne/mtg-data/data/mtg.db.gz
          https://raw.githubusercontent.com/nwgarne/mtg-data/data/manifest.json
          https://raw.githubusercontent.com/nwgarne/mtg-data/data/rules.txt
          ```

          `rules.txt` is the Comprehensive Rules mirror maintained on `main` by the [rules workflow](https://github.com/nwgarne/mtg-data/actions/workflows/rules.yml), republished here so a consumer can fetch cards and rules from one place. `manifest.json` describes it with `rules_sha256`, `rules_effective_date` and `rules_size_bytes`; the effective date is the one printed in the CR text itself.

          These serve the identical artifact as the [`latest` Release](https://github.com/nwgarne/mtg-data/releases/tag/latest), on the same daily refresh schedule. See the [main branch README](https://github.com/nwgarne/mtg-data/blob/main/README.md) for schema and usage.
          EOF

          git add mtg.db.gz manifest.json rules.txt README.md
          git commit -q -m "data refresh: ${BUILT_AT} (cards=${CARDS}, rulings=${RULINGS}, CR ${CR_DATE})"
          git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:data

      - name: Summary
        run: |
          {
            echo "## Build complete"
            echo ""
            echo '```json'
            cat /tmp/manifest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
